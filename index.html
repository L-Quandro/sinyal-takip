<!DOCTYPE html>
<html lang="tr" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sinyal Takip Sistemi</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: linear-gradient(180deg, #121218 0%, #09090c 100%);
            --text-main: #fff;
            --km-color: #00e676;
            --station-color: #ffc107;
            --border-color: #2a2a3a;
            --wheel-bg: #0c0c10;
            --topbar-bg: #141419;
            --subtext-color: #888;
            --brand-blue: rgba(100,181,246,.18);
        }
        html.light-mode {
            --bg-color: #f0f2f5;
            --panel-bg: linear-gradient(180deg, #fff 0%, #e4e8ed 100%);
            --text-main: #1a1a1a;
            --km-color: #008744;
            --station-color: #d35400;
            --border-color: #cbd5e1;
            --wheel-bg: #e2e8f0;
            --topbar-bg: #cbd5e1;
            --subtext-color: #666;
            --brand-blue: rgba(25,118,210,.75);
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .hidden { display: none !important; }

        /* Setup Screen */
        #setup-screen {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        #setup-screen h2 { color: var(--station-color); margin-bottom: 30px; letter-spacing: 1px; text-align: center; }
        .select-box {
            width: 100%; max-width: 320px; padding: 16px; margin-bottom: 20px;
            font-size: 1.1rem; border-radius: 12px; border: 1px solid var(--border-color);
            background: var(--wheel-bg); color: var(--text-main); outline: none;
        }
        .start-btn {
            width: 100%; max-width: 320px; padding: 18px; font-size: 1.2rem; font-weight: bold;
            border-radius: 12px; border: none; background: linear-gradient(135deg,#00e676,#00b0ff);
            color: #000; cursor: pointer; box-shadow: 0 4px 15px rgba(0,230,118,.3);
        }

        /* Driving Screen */
        #driving-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* Top Bar */
        .top-bar {
            background: var(--topbar-bg);
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 20;
        }
        .route-name { font-size: .85rem; font-weight: 700; text-transform: uppercase; }
        .top-controls { display: flex; gap: 6px; }
        .control-btn {
            background: var(--wheel-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 5px 8px;
            border-radius: 6px; font-size: .8rem; cursor: pointer; font-weight: bold;
        }

        /* Middle Touch Area */
        .touch-zone-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }
        .touch-top, .touch-bottom {
            position: absolute; left: 0; right: 0; width: 100%;
            z-index: 5; cursor: pointer; height: 50%; background: transparent;
            transition: background-color 0.1s ease;
        }
        .touch-top { top: 0; }
        .touch-bottom { bottom: 0; }
        
        .touch-top.clicked { background-color: rgba(0, 176, 255, 0.15); }
        .touch-bottom.clicked { background-color: rgba(0, 230, 118, 0.15); }
        
        html.light-mode .touch-top.clicked { background-color: rgba(0, 176, 255, 0.30); }
        html.light-mode .touch-bottom.clicked { background-color: rgba(0, 230, 118, 0.30); }

        .ripple-effect {
            position: absolute; border-radius: 50%; background: rgba(255,255,255,.12);
            transform: scale(0); animation: ripple .15s ease-out; pointer-events: none;
        }
        html.light-mode .ripple-effect { background: rgba(0,0,0,.15); }
        @keyframes ripple { to { transform: scale(3); opacity: 0; } }

        .display-card {
            flex: 1; margin: 8px 10px; background: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 20px;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,.4);
            pointer-events: none; z-index: 10; position: relative; 
            transition: transform 0.1s ease;
        }
        .display-card.pulse { transform: scale(0.985); }
        
        .station-badge {
            font-size: 1.1rem; color: var(--station-color); background: rgba(255,193,7,.18);
            padding: 6px 20px; border-radius: 24px; border: 1.5px solid rgba(255,193,7,.6);
            margin-bottom: 8px; font-weight: 800; pointer-events: auto; z-index: 25; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,193,7,.2);
            transition: transform 0.1s ease, background 0.1s ease;
        }
        .station-badge:active { transform: scale(0.93); background: rgba(255,193,7,.35); }

        .main-info-group { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
        .km-box { display: flex; align-items: baseline; gap: 8px; }
        .km-label { font-size: 1.1rem; opacity: .7; font-weight: 600; }
        
        .km-value { 
            font-size: 2.6rem; font-weight: 800; color: var(--km-color); 
            letter-spacing: 1px; font-family: monospace; 
        }
        html.light-mode .km-value { color: #00642e; }
        
        .signal-type-tag { 
            margin-top: 6px; font-size: .85rem; opacity: .9; background: var(--wheel-bg); 
            padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border-color); 
        }

        .brand-text { position: absolute; bottom: 16px; font-size: .75rem; font-weight: 600; color: var(--brand-blue); letter-spacing: 1px; transition: color 0.2s ease; }

        /* Akıcı Çark Sistemli Alt Panel */
        .triple-panel-container {
            flex-shrink: 0; background: var(--wheel-bg); border-top: 2px solid var(--border-color);
            display: flex; flex-direction: column; padding: 4px 12px; gap: 4px;
            box-sizing: border-box; z-index: 20; touch-action: none;
        }

        .panel-row {
            height: 38px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; border-radius: 8px; font-size: 0.9rem; opacity: 0.55;
            transition: opacity 0.15s ease, background 0.15s ease; border: 1px solid transparent; cursor: pointer;
        }
        html.light-mode .panel-row { opacity: 0.65; }
        .panel-row:active { background: rgba(0, 0, 0, 0.08); }
        html.light-mode .panel-row:active { background: rgba(0, 0, 0, 0.05); }

        .panel-row .p-station { color: var(--station-color); font-size: 0.8rem; font-weight: 600; flex: 1; text-align: left; }
        .panel-row .p-name { font-weight: 700; flex: 1; text-align: center; }
        .panel-row .p-km { font-family: monospace; flex: 1; text-align: right; }

        .panel-row.active {
            opacity: 1 !important; background: rgba(0, 230, 118, 0.12);
            border: 1.5px solid var(--km-color); font-size: 1rem; box-shadow: 0 2px 8px rgba(0,230,118,0.15);
        }
        .panel-row.active .p-name { color: var(--text-main); font-weight: 800; }
        .panel-row.active .p-km { color: var(--km-color); font-weight: 800; }
        html.light-mode .panel-row.active .p-km { color: #00642e; }

        /* İstasyon Seçim Modal Penceresi */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.85); z-index: 100; display: flex;
            justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px);
        }
        .modal-card {
            background: var(--topbar-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 20px; width: 100%; max-width: 320px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.6);
        }
        .modal-card h3 { margin: 0 0 5px; color: var(--station-color); text-align: center; font-size: 1.1rem; }
        .station-option-btn {
            background: var(--wheel-bg); color: var(--text-main); border: 1px solid var(--border-color);
            padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1.05rem; cursor: pointer; text-align: center;
            transition: background 0.1s;
        }
        .station-option-btn:active { background: var(--station-color); color: #000; }
        #dimmer-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #000; opacity: 0; pointer-events: none; z-index: 99; transition: opacity .2s;
        }

        /* --- OTOMATİK BOYUTLANDIRMA & YATAY MOD (LANDSCAPE) ENTEGRASYONU --- */
        @media (orientation: landscape) and (max-height: 500px) {
            .top-bar { padding: 4px 10px; }
            .display-card { margin: 4px 10px; padding: 4px; }
            .station-badge { font-size: 0.95rem; padding: 4px 14px; margin-bottom: 4px; }
            .km-value { font-size: 2rem; }
            .signal-type-tag { margin-top: 2px; font-size: 0.75rem; padding: 2px 8px; }
            .brand-text { display: none; }
            .triple-panel-container { padding: 2px 10px; }
            .panel-row { height: 32px; font-size: 0.8rem; }
        }
    </style>
</head>

            </div>
        </div>

                <span class="p-km" id="p-prev-k">-</span>

                <span class="p-name" id="p-next-n">-</span>
                <span class="p-km" id="p-next-k">-</span>
            </div>
        </div>
    </div>

                { s: "MAHMUTLAR", n: "YAKLAŞMA", k: "94/6", t: "YAKLAŞMA" },

                { s: "KIRIKKALE", n: "BLOK/YAKLAŞMA", k: "90/4", t: "YAKLAŞMA" },
                { s: "KIRIKKALE", n: "YAKLAŞMA", k: "87/17", t: "YAKLAŞMA" },
                { s: "KIRIKKALE", n: "GİRİŞ", k: "86/9", t: "İSTASYON GİRİŞ" },

                { s: "YAHŞİHAN", n: "SON İSTASYON", k: "—", t: "İSTASYON GİRİŞ" }
            ]
        };

        const $ = id => document.getElementById(id);
        let currentData = [], cIdx = 0, bright = 0;
        
        function cleanName(n) {
            let cleaned = n.replace(/\s*(GİRİŞ|ÇIKIŞ|BLOK|YAKLAŞMA|VARYA)/g, '').trim();
            return cleaned === '' ? n : cleaned;
        }
        
        function startDriving() {
            const selectedRoute = $('route-select').value;
            currentData = routeDB[selectedRoute];
            $('ui-route-name').innerText = $('route-select').options[$('route-select').selectedIndex].text;
            toggleScreen(1);
        }

        function toggleScreen(drive) {
            $('setup-screen').classList.toggle('hidden', drive);
            $('driving-screen').classList.toggle('hidden', !drive);
            if(drive) update(0);
        }

        function toggleModal(show) {
            $('station-modal').classList.toggle('hidden', !show);
            if(show) {
                const uniqueStations = [...new Set(currentData.map(d => d.s))];
                $('station-list-options').innerHTML = uniqueStations.map(stationName => 
                    `<button class="station-option-btn" onclick="jumpToStation('${stationName}')">${stationName}</button>`
                ).join('');
            }
        }
        
        function jumpToStation(stationName) {
            const index = currentData.findIndex(d => d.s === stationName);
            if(index !== -1) update(index);
            toggleModal(0);
        }
        
        function touch(e, dir) {
            const zoneEl = $(dir === 1 ? 'zone-top' : 'zone-bottom');
            zoneEl.classList.add('clicked');
            setTimeout(() => zoneEl.classList.remove('clicked'), 120);

            const card = $('main-display-card');
            card.classList.add('pulse');
            setTimeout(() => card.classList.remove('pulse'), 100);

            const el = e.currentTarget, d = Math.max(el.clientWidth, el.clientHeight), rect = el.getBoundingClientRect();
            const r = document.createElement("span");
            r.className = "ripple-effect";
            r.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - rect.left - d/2}px;top:${e.clientY - rect.top - d/2}px`;
            
            if(el.firstChild) el.firstChild.remove();
            el.appendChild(r);
            
            update(Math.max(0, Math.min(currentData.length - 1, cIdx + dir)));
        }

        function navigateRow(direction) {
            const newIndex = cIdx + direction;
            if (newIndex >= 0 && newIndex < currentData.length) update(newIndex);
        }

        const wheelContainer = $('wheel-container');
        let isDragging = false, startY = 0, startIdx = 0;

        wheelContainer.addEventListener('touchstart', e => {
            isDragging = true; startY = e.touches[0].clientY; startIdx = cIdx;
        }, {passive: true});

        wheelContainer.addEventListener('touchmove', e => {
            if (!isDragging) return;
            e.preventDefault();
            const diff = startY - e.touches[0].clientY; 
            const step = Math.round(diff / 35); 
            const targetIdx = Math.max(0, Math.min(currentData.length - 1, startIdx + step));
            if (targetIdx !== cIdx) update(targetIdx);
        }, {passive: false});

        wheelContainer.addEventListener('touchend', () => { isDragging = false; }, {passive: true});
        
        function update(i) {
            cIdx = i; 
            const curr = currentData[i];

            $('m-station').innerText = curr.s; 
            $('m-km').innerText = curr.k; 
            $('m-type').innerText = curr.t;

            $('p-curr-s').innerText = curr.s;
            $('p-curr-n').innerText = cleanName(curr.n);
            $('p-curr-k').innerText = curr.k;

            const updateRow = (rowId, prefix, data, emptyText) => {
                const row = $(rowId);
                if (data) {
                    $(`p-${prefix}-s`).innerText = data.s;
                    $(`p-${prefix}-n`).innerText = cleanName(data.n);
                    $(`p-${prefix}-k`).innerText = data.k;
                    row.style.opacity = document.documentElement.classList.contains('light-mode') ? "0.65" : "0.55";
                    row.style.pointerEvents = "auto";
                } else {
                    $(`p-${prefix}-s`).innerText = "";
                    $(`p-${prefix}-n`).innerText = emptyText;
                    $(`p-${prefix}-k`).innerText = "";
                    row.style.opacity = "0.2";
                    row.style.pointerEvents = "none";
                }
            };

            updateRow('row-prev', 'prev', currentData[i - 1], "— BAŞLANGIÇ —");
            updateRow('row-next', 'next', currentData[i + 1], "— SON SİNYAL —");
        }
        
        function toggleTheme() {
            const cl = document.documentElement.classList, isD = cl.contains('dark-mode');
            cl.toggle('dark-mode', !isD); cl.toggle('light-mode', isD);
            $('btn-theme').innerText = isD ? "☀️ Gündüz" : "🌙 Gece";
            update(cIdx);
        }
        
        function toggleBright() {
            bright = (bright + 1) % 3;
            $('dimmer-overlay').style.cssText = bright === 0 ? 'opacity:0' : bright === 1 ? 'opacity:0.4' : 'opacity:0.75;background:#000';
            $('btn-bright').innerText = bright === 0 ? '💡 Normal' : bright === 1 ? '🔅 Kısık' : '🌙 Karartma';
        }
    </script>
</body>
